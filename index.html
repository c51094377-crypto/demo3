<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLB Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; user-select: none; }
        #ui-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(255, 255, 255, 0.9); padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        #status { font-size: 13px; font-weight: bold; color: #333; margin-top: 8px; line-height: 1.5; }

        /* オンライン対戦用 UI スタイル */
        #online-container {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
        }
        #my-peer-id { color: #0066cc; background: #eef5ff; padding: 3px 8px; border-radius: 4px; border: 1px solid #b3d1ff; letter-spacing: 1px; }
        #target-peer-id { padding: 4px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; width: 100px; text-align: center; }
        #connect-btn { padding: 4px 12px; font-size: 12px; font-weight: bold; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #connect-btn:hover { background-color: #218838; }
        #conn-status { color: #666; font-size: 12px; }

        /* STORES MANAGEMENT モニターUIのスタイル */
        #stores-monitor-ui {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 480px;
            max-width: 90vw;
            max-height: 85vh;
            background-color: rgba(5, 20, 10, 0.92);
            border: 3px solid #00ff66;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.5), inset 0 0 15px rgba(0, 255, 102, 0.2);
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            overflow-y: auto;
        }

        #stores-monitor-ui h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00ff66;
            border-bottom: 2px solid #00ff66;
            padding-bottom: 8px;
        }

        .pylon-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: bold;
        }

        .pylon-label {
            letter-spacing: 1px;
        }

        .pylon-select {
            background-color: #031408;
            color: #00ff66;
            border: 2px solid #00ff66;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 15px;
            font-family: inherit;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
            text-align: center;
        }

        .pylon-select:hover, .pylon-select:focus {
            background-color: #00ff66;
            color: #000;
            box-shadow: 0 0 10px #00ff66;
        }

        .pylon-select option {
            background-color: #031408;
            color: #00ff66;
        }

        #close-stores-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        #close-stores-btn:hover {
            background-color: #00ff66;
            color: #000;
            box-shadow: 0 0 12px #00ff66;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="online-container">
            <span>MY ROOM ID:</span>
            <span id="my-peer-id">発行中...</span>
            <input type="text" id="target-peer-id" placeholder="数字IDを入力" pattern="[0-9]*">
            <button id="connect-btn">決定</button>
            <span id="conn-status">[未接続]</span>
        </div>

        <input type="file" id="file-input" accept=".zip,.glb,.gltf">
        <div id="status">
            【C】カメラ切替 / 【G】脚・ハッチ / 【V】キャノピー / 【Q/E】スロットル / 【W/S】操縦桿・昇降舵 / 【A/D】操縦桿・エルロン / 【< / >】方向舵 / 【@】武装選択 / 【O】左画面 / 【P】右画面 / 【Z】HMD切替 / 【X】HUD右切替 / 【Shift】GAU-8発射 / 【矢印キー】見回し
        </div>
    </div>
    
    <div id="stores-monitor-ui">
        <h2>STORES MANAGEMENT</h2>
        <div id="pylon-list-container"></div>
        <button id="close-stores-btn">CLOSE MONITOR UI</button>
    </div>

    <canvas id="canvas3d"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 安全チェッカー
        function isNumOk(val) { return typeof val === 'number' && !isNaN(val) && isFinite(val); }
        function safeQuat(q) {
            if (!q || !isNumOk(q.x) || !isNumOk(q.y) || !isNumOk(q.z) || !isNumOk(q.w)) {
                if (q) q.set(0, 0, 0, 1);
                return;
            }
            const lenSq = q.x * q.x + q.y * q.y + q.z * q.z + q.w * q.w;
            if (lenSq < 1e-8 || !isNumOk(lenSq)) {
                q.set(0, 0, 0, 1);
            } else {
                q.normalize();
            }
        }

        const キャンバス = document.querySelector('#canvas3d');
        const シーン = new THREE.Scene();
        シーン.background = new THREE.Color(0x1a1a1a);

        const デフォルトカメラ = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 10000);
        デフォルトカメラ.position.set(0, 1.5, 10);
        デフォルトカメラ.lookAt(0, 0, 0);
        デフォルトカメラ.rotation.order = 'YXZ';

        let カメラリスト = [デフォルトカメラ];
        let アクティブカメラ = デフォルトカメラ;
        let 現在のカメラ番号 = 0;
        let 現在のモデル = null;

        const レンダラー = new THREE.WebGLRenderer({ canvas: キャンバス, antialias: true, logarithmicDepthBuffer: true });
        レンダラー.setSize(window.innerWidth, window.innerHeight);
        レンダラー.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        レンダラー.toneMapping = THREE.ACESFilmicToneMapping;
        レンダラー.toneMappingExposure = 1.0;

        // 計算用の最適化用一時変数
        const _vUp = new THREE.Vector3();
        const _vCamRight = new THREE.Vector3();
        const _qRotDelta = new THREE.Quaternion();
        const _qCamDelta = new THREE.Quaternion();

        // ライティング
        const アンビエントライト = new THREE.AmbientLight(0xffffff, 2.5);
        シーン.add(アンビエントライト);
        const 平行光源 = new THREE.DirectionalLight(0xffffff, 3.0);
        平行光源.position.set(10, 20, 15);
        シーン.add(平行光源);

        // 音声制御用変数
        let audioContext = null;
        let audioBuffer = null;
        let audioSource = null;
        let isAudioPlaying = false;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playGunAudio() {
            if (!audioBuffer || !audioContext || isAudioPlaying) return;
            try {
                audioSource = audioContext.createBufferSource();
                audioSource.buffer = audioBuffer;
                audioSource.loop = true;
                audioSource.connect(audioContext.destination);
                audioSource.start(0);
                isAudioPlaying = true;
            } catch (e) {
                console.error(e);
            }
        }

        function stopGunAudio() {
            if (audioSource && isAudioPlaying) {
                try {
                    audioSource.stop();
                    audioSource.disconnect();
                } catch (e) {
                    console.error(e);
                }
                audioSource = null;
                isAudioPlaying = false;
            }
        }

        // キー入力状態
        const キー入力状態 = { 
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            KeyA: false, KeyD: false, KeyW: false, KeyS: false,
            KeyQ: false, KeyE: false,
            RudderLeft: false, RudderRight: false,
            ShiftLeft: false, ShiftRight: false
        };

        // GAU8 & 弾頭 (7種類) 射撃システム用変数
        let GAU8_Obj = null;
        let WinMag_BaseObjs = []; // 弾頭, 弾頭_1 〜 弾頭_6 ボーンオブジェクト
        const bulletNames = ['弾頭', '弾頭_1', '弾頭_2', '弾頭_3', '弾頭_4', '弾頭_5', '弾頭_6'];
        let activeBullets = []; // 飛翔中弾丸
        let currentBulletIndex = 0; // 発射順序 (0〜6)
        let lastFireTime = 0;
        const FIRE_INTERVAL = 15; // 発射間隔 (ms) : GAU-8の高連射レート(約3900rpm)に対応
        const BULLET_SPEED = 12.0; // 弾丸初速

        // 機体/GAU-8の慣性（速度ベクトル）計算用変数
        const prevGauPos = new THREE.Vector3();
        const gauVelocity = new THREE.Vector3();
        let isFirstFramePos = true;

        // 光線（トレーサー）拡大サイズ & マテリアル
        const bulletGeo = new THREE.CylinderGeometry(0.12, 0.12, 5.0, 8);
        bulletGeo.rotateX(Math.PI / 2);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });

        // 脚・ハッチアニメーション管理
        const ハッチ名一覧 = ['主脚左ハッチ', '主脚右ハッチ', '前脚ハッチ前', '前脚ハッチ後'];
        const 脚名一覧 = ['主脚右', '主脚左', '前脚'];
        
        let アニメーション対象パーツ = [];
        let アニメーション状態 = 'OPEN'; // 初期展開状態(XYZ 0°)スタート
        let アニメーション開始時間 = 0;
        const ゼロ回転 = new THREE.Quaternion(0, 0, 0, 1);

        // キャノピーアニメーション管理
        let キャノピーオブジェクト = null;
        let キャノピーアニメーション状態 = 'OPEN'; // キャノピーも初期展開状態
        let キャノピー開始時間 = 0;
        let キャノピーInitQuat = new THREE.Quaternion();
        let キャノピーStartQuat = new THREE.Quaternion();

        // 操縦舵面・スロットル・エンジン・操縦桿オブジェクトおよびパラメータ
        let エルロン左 = null, エルロン右 = null;
        let 昇降舵左 = null, 昇降舵右 = null;
        let 方向舵左 = null, 方向舵右 = null;
        let スロットル右 = null, スロットル左 = null;
        let スロットル右_InitPos = new THREE.Vector3();
        let スロットル左_InitPos = new THREE.Vector3();
        let エンジン右 = null, エンジン左 = null;
        let 操縦桿 = null;

        let エルロン角度 = 0;
        let 昇降舵角度 = 0;
        let 方向舵角度 = 0;
        let スロットル量 = 0; // 0.0 ～ 1.0
        const 最大スロットル移動量 = 1.465;
        const A10C_最大舵角 = THREE.MathUtils.degToRad(25);
        const 操縦桿_最大角度 = THREE.MathUtils.degToRad(25);
        const 舵面移動速度 = 0.03;

        // モニター・HUD・HMD画面システム
        let HUDオブジェクト = null;
        let HUD右オブジェクト = null; 
        let hudRight有効 = false;    

        let HMD左オブジェクト = null;
        let HMD右オブジェクト = null;
        let HMDオブジェクト = null;
        let 左画面オブジェクト = null;
        let 右画面オブジェクト = null;

        let 左画面モード = 2; // 初期値を対地レーダー (AG RADAR) に設定
        let 右画面モード = 1; // 初期値を対空レーダー (AA RADAR) に設定
        let hmd有効 = false;

        // HUD テクスチャ
        const hudCanvas = document.createElement('canvas');
        hudCanvas.width = 1024; hudCanvas.height = 1024;
        const hudCtx = hudCanvas.getContext('2d');
        const hudTexture = new THREE.CanvasTexture(hudCanvas);

        // HMD左専用テクスチャ
        const hmdLeftCanvas = document.createElement('canvas');
        hmdLeftCanvas.width = 1024; hmdLeftCanvas.height = 1024;
        const hmdLeftCtx = hmdLeftCanvas.getContext('2d');
        const hmdLeftTexture = new THREE.CanvasTexture(hmdLeftCanvas);

        // HMD右専用テクスチャ
        const hmdRightCanvas = document.createElement('canvas');
        hmdRightCanvas.width = 1024; hmdRightCanvas.height = 1024;
        const hmdRightCtx = hmdRightCanvas.getContext('2d');
        const hmdRightTexture = new THREE.CanvasTexture(hmdRightCanvas);

        // MFDテクスチャ
        const leftCanvas = document.createElement('canvas');
        leftCanvas.width = 1024; leftCanvas.height = 1024;
        const leftCtx = leftCanvas.getContext('2d');
        const leftTexture = new THREE.CanvasTexture(leftCanvas);

        const rightCanvas = document.createElement('canvas');
        rightCanvas.width = 1024; rightCanvas.height = 1024;
        const rightCtx = rightCanvas.getContext('2d');
        const rightTexture = new THREE.CanvasTexture(rightCanvas);

        function getModeTitle(mode) {
            const titles = ["FLT CTRL", "AA RADAR", "AG RADAR", "ENG SYS", "DAMAGE", "STORES"];
            return titles[mode] || "MONITOR";
        }

        // --- オンライン対戦 (P2P通信 PeerJS) システム変数 ---
        let peer = null;
        let activeConn = null;
        let currentRole = 'NONE'; // 'HOST' または 'GUEST'
        let modelNodeMap = {};
        let currentModelBuffer = null;
        let currentModelFileName = "";
        const ID_PREFIX = "a10game-num-id-v2-";

        // 受信チャンクバッファ (ゲスト用)
        let incomingChunks = [];
        let expectedTotalChunks = 0;
        let receivedFileName = "";

        function generateNumericID() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function initOnlinePeer() {
            const numId = generateNumericID();
            peer = new Peer(ID_PREFIX + numId);

            peer.on('open', (id) => {
                const displayId = id.replace(ID_PREFIX, '');
                document.getElementById('my-peer-id').innerText = displayId;
            });

            peer.on('connection', (conn) => {
                currentRole = 'HOST';
                setupConnection(conn);
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                document.getElementById('conn-status').innerText = "[接続エラー]";
                document.getElementById('conn-status').style.color = "red";
            });
        }

        // フォルダ非依存・全メモリ上ロード関数（ZIP内の全テクスチャ/binをBlob URL化しローカルフォルダ参照を排除）
        async function parseZipBufferInMemory(zipBuffer) {
            const zip = await JSZip.loadAsync(zipBuffer);
            const fileMap = {};
            let mainModelFileName = null;
            let audioFile = null;

            for (const filename of Object.keys(zip.files)) {
                if (zip.files[filename].dir) continue;
                const file = zip.files[filename];

                if (filename.endsWith('.glb') || filename.endsWith('.gltf')) {
                    mainModelFileName = filename;
                } else if (filename.endsWith('.mp3')) {
                    audioFile = file;
                } else {
                    const blob = await file.async('blob');
                    const blobUrl = URL.createObjectURL(blob);
                    fileMap[filename] = blobUrl;
                    const shortName = filename.split('/').pop();
                    fileMap[shortName] = blobUrl;
                }
            }

            if (audioFile) {
                const audioData = await audioFile.async('arraybuffer');
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioContext.decodeAudioData(audioData);
            }

            if (mainModelFileName) {
                const modelFile = zip.files[mainModelFileName];
                const modelBuf = await modelFile.async('arraybuffer');

                const manager = new THREE.LoadingManager();
                manager.setURLModifier((url) => {
                    const cleanUrl = url.replace(/^.*[\\\/]/, '');
                    if (fileMap[cleanUrl]) return fileMap[cleanUrl];
                    if (fileMap[url]) return fileMap[url];
                    return url;
                });

                const loader = new GLTFLoader(manager);
                loader.parse(modelBuf, '', (gltf) => {
                    parseAndSetupModel(gltf);
                });
            }
        }

        // WebRTC Safe Chunk (16KB) 送信非同期処理（送信側にもリアルタイム%表示追加）
        async function sendModelToGuest() {
            if (currentRole === 'HOST' && activeConn && activeConn.open && currentModelBuffer) {
                document.getElementById('conn-status').innerText = "[送信中 0%]";
                document.getElementById('conn-status').style.color = "orange";
                
                const chunkSize = 16 * 1024; // 16KB (WebRTC Safe Packet Size)
                const totalChunks = Math.ceil(currentModelBuffer.byteLength / chunkSize);

                activeConn.send({
                    type: 'modelStart',
                    totalChunks: totalChunks,
                    fileName: currentModelFileName
                });

                for (let i = 0; i < totalChunks; i++) {
                    if (!activeConn || !activeConn.open) break;

                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, currentModelBuffer.byteLength);
                    const chunk = currentModelBuffer.slice(start, end);

                    activeConn.send({
                        type: 'modelChunk',
                        index: i,
                        chunk: chunk
                    });

                    const progress = Math.floor(((i + 1) / totalChunks) * 100);
                    document.getElementById('conn-status').innerText = `[送信中 ${progress}%]`;

                    // 10パケットごとに10msの非同期ウェイトを入れ、WebRTC DataChannel Bufferのパンクを防ぐ
                    if (i % 10 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 10));
                    }
                }
                document.getElementById('conn-status').innerText = "[送信完了!]";
                document.getElementById('conn-status').style.color = "green";
            }
        }

        function setupConnection(conn) {
            activeConn = conn;

            const onConnectionOpen = () => {
                document.getElementById('conn-status').innerText = "[接続完了!]";
                document.getElementById('conn-status').style.color = "green";

                if (currentRole === 'GUEST') {
                    document.getElementById('file-input').style.display = 'none';
                } else if (currentRole === 'HOST') {
                    sendModelToGuest();
                }
            };

            if (conn.open) {
                onConnectionOpen();
            } else {
                conn.on('open', onConnectionOpen);
            }

            activeConn.on('data', async (data) => {
                if (!data) return;

                // ゲスト側：ホストからのモデル開始通知
                if (data.type === 'modelStart' && currentRole === 'GUEST') {
                    incomingChunks = new Array(data.totalChunks);
                    expectedTotalChunks = data.totalChunks;
                    receivedFileName = data.fileName || 'model.glb';
                    document.getElementById('conn-status').innerText = `[受信中 0%]`;
                    document.getElementById('conn-status').style.color = "orange";
                }

                // ゲスト側：モデルのチャンクデータ受信
                else if (data.type === 'modelChunk' && currentRole === 'GUEST') {
                    incomingChunks[data.index] = data.chunk;
                    const receivedCount = incomingChunks.filter(c => c !== undefined).length;
                    const progress = Math.floor((receivedCount / expectedTotalChunks) * 100);
                    document.getElementById('conn-status').innerText = `[受信中 ${progress}%]`;

                    if (receivedCount === expectedTotalChunks) {
                        document.getElementById('conn-status').innerText = "[モデル構築中...]";
                        
                        let totalByteLength = 0;
                        incomingChunks.forEach(c => {
                            if (c) totalByteLength += (c.byteLength || c.length || 0);
                        });

                        const mergedBuffer = new Uint8Array(totalByteLength);
                        let offset = 0;
                        incomingChunks.forEach(c => {
                            if (c) {
                                const u8 = new Uint8Array(c);
                                mergedBuffer.set(u8, offset);
                                offset += u8.byteLength;
                            }
                        });

                        resetStateForNewModel();
                        const buffer = mergedBuffer.buffer;

                        if (receivedFileName.endsWith('.zip')) {
                            await parseZipBufferInMemory(buffer);
                            document.getElementById('conn-status').innerText = "[同期完了!]";
                            document.getElementById('conn-status').style.color = "green";
                        } else {
                            const loader = new GLTFLoader();
                            loader.parse(buffer, '', (gltf) => {
                                parseAndSetupModel(gltf);
                                document.getElementById('conn-status').innerText = "[同期完了!]";
                                document.getElementById('conn-status').style.color = "green";
                            });
                        }
                    }
                } 

                else if (data.type === 'telemetry' && currentRole === 'GUEST') {
                    if (data.camPos) デフォルトカメラ.position.set(data.camPos.x, data.camPos.y, data.camPos.z);
                    if (data.camRot) デフォルトカメラ.quaternion.set(data.camRot.x, data.camRot.y, data.camRot.z, data.camRot.w);

                    if (data.nodes) {
                        for (let name in data.nodes) {
                            const node = modelNodeMap[name];
                            if (node) {
                                const t = data.nodes[name];
                                if (t.p) node.position.set(t.p.x, t.p.y, t.p.z);
                                if (t.q) node.quaternion.set(t.q.x, t.q.y, t.q.z, t.q.w);
                                if (t.v !== undefined) node.visible = t.v;
                            }
                        }
                    }

                    if (data.throttle !== undefined) スロットル量 = data.throttle;
                    if (data.aileron !== undefined) エルロン角度 = data.aileron;
                    if (data.elevator !== undefined) 昇降舵角度 = data.elevator;
                    if (data.rudder !== undefined) 方向舵角度 = data.rudder;

                    if (data.leftMode !== undefined) 左画面モード = data.leftMode;
                    if (data.rightMode !== undefined) 右画面モード = data.rightMode;
                    if (data.hmd !== undefined) hmd有効 = data.hmd;
                    if (data.hudRight !== undefined) {
                        hudRight有効 = data.hudRight;

        function カメラの最適化(カメラ) {
            if (カメラ && カメラ.isPerspectiveCamera) {
                const aspect = window.innerWidth / window.innerHeight;
                カメラ.aspect = isNumOk(aspect) && aspect > 0 ? aspect : 1.0;
                カメラ.near = 0.01;
                カメラ.far = 10000;
                カメラ.updateProjectionMatrix();
            }
        }
        カメラの最適化(アクティブカメラ);

        // ファイル選択イベント (ホストのみが実行)
        document.getElementById('file-input').addEventListener('change', async function(イベント) {
            const ファイル = イベント.target.files[0];
            if (!ファイル) return;

            currentRole = 'HOST';
            initAudio();
            resetStateForNewModel();

            currentModelFileName = ファイル.name;
            const loadedFileBuffer = await ファイル.arrayBuffer();
            currentModelBuffer = loadedFileBuffer;

            // 接続中のゲストがあれば即座にモデルバイナリ転送
            sendModelToGuest();

            if (ファイル.name.endsWith('.zip')) {
                await parseZipBufferInMemory(loadedFileBuffer);
            } else {
                const loader = new GLTFLoader();
                loader.parse(loadedFileBuffer, '', (gltf) => {
                    parseAndSetupModel(gltf);
                });
            }
        });

        let allParsedCameras = [];

        function filterAndSetCameraList() {
            if (allParsedCameras.length > 0) {
                カメラリスト = [...allParsedCameras];
            } else {
                カメラリスト = [デフォルトカメラ];
            }

            現在のカメラ番号 = 0;
            アクティブカメラ = カメラリスト[0];
            カメラの最適化(アクティブカメラ);
        }

        function parseAndSetupModel(読み込みデータ) {
            現在のモデル = 読み込みデータ.scene;
            シーン.add(現在のモデル);

            アニメーション対象パーツ = [];
            WinMag_BaseObjs = new Array(7).fill(null);
            allParsedCameras = [];
            modelNodeMap = {};

            const 全パーツ名 = [...ハッチ名一覧, ...脚名一覧];
            現在のモデル.traverse((child) => {
                if (child.name) {
                    modelNodeMap[child.name] = child;
                }

                if (全パーツ名.includes(child.name)) {
                    const originalQuat = child.quaternion.clone();
                    child.quaternion.set(0, 0, 0, 1);
                    アニメーション対象パーツ.push({
                        mesh: child,
                        name: child.name,
                        type: ハッチ名一覧.includes(child.name) ? 'HATCH' : 'GEAR',
                        initQuat: originalQuat,
                        startQuat: new THREE.Quaternion(0, 0, 0, 1)
                    });
                }
                if (child.name === 'キャノピー') {
                    キャノピーオブジェクト = child;
                    キャノピーInitQuat.copy(child.quaternion);
                    child.quaternion.set(0, 0, 0, 1);
                    キャノピーStartQuat.set(0, 0, 0, 1);
                }
                if (child.name === 'エルロン左') エルロン左 = child;
                if (child.name === 'エルロン右') エルロン右 = child;
                if (child.name === '昇降舵左') 昇降舵左 = child;
                if (child.name === '昇降舵右') 昇降舵右 = child;
                if (child.name === '方向舵左') 方向舵左 = child;
                if (child.name === '方向舵右') 方向舵右 = child;

                // スロットル・エンジン・操縦桿の取得と初期設定
                if (child.name === 'スロットル右') {
                    スロットル右 = child;
                    スロットル右_InitPos.copy(child.position);
                }
                if (child.name === 'スロットル左') {
                    スロットル左 = child;
                    スロットル左_InitPos.copy(child.position);
                }
                if (child.name === 'エンジン右') エンジン右 = child;
                if (child.name === 'エンジン左') エンジン左 = child;
                if (child.name === '操縦桿') 操縦桿 = child;

                // GAU8 & 弾頭 (7種類) 登録
                if (child.name === 'GAU8') {
                    GAU8_Obj = child;
                }
                for (let i = 0; i < bulletNames.length; i++) {
                    if (child.name === bulletNames[i]) {
                        WinMag_BaseObjs[i] = child;
                    }
                }

                // HUDパーツ（メイン）
                if (child.name === 'HUD') {
                    HUDオブジェクト = child;
                    HUDオブジェクト.material = new THREE.MeshBasicMaterial({
                        map: hudTexture,
                        transparent: true,
                        opacity: 0.95,
                        depthWrite: false,
                        side: THREE.FrontSide
                    });
                }

                // HUD右パーツ
                if (child.name === 'HUD右') {
                    HUD右オブジェクト = child;
                    HUD右オブジェクト.material = new THREE.MeshBasicMaterial({
                        map: hudTexture,
                        transparent: true,
                        opacity: 0.95,
                        depthWrite: false,
                        side: THREE.FrontSide
                    });
                    HUD右オブジェクト.visible = hudRight有効;
                }

                // HMD左パーツ
                if (child.name === 'HMD左') {
                    HMD左オブジェクト = child;
                    HMD左オブジェクト.material = new THREE.MeshBasicMaterial({
                        map: hmdLeftTexture,
                        transparent: true,
                        opacity: 0.95,
                        depthWrite: false,
                        side: THREE.FrontSide
                    });
                }

                // HMD右パーツ
                if (child.name === 'HMD右') {
                    HMD右オブジェクト = child;
                    HMD右オブジェクト.material = new THREE.MeshBasicMaterial({
                        map: hmdRightTexture,
                        transparent: true,
                        opacity: 0.95,
                        depthWrite: false,
                        side: THREE.FrontSide
                    });
                }

                if (child.name === 'HMD') {
                    HMDオブジェクト = child;
                    HMDオブジェクト.material = new THREE.MeshBasicMaterial({
                        map: hmdLeftTexture,
                        transparent: true,
                        opacity: 0.95,
                        depthWrite: false,
                        side: THREE.FrontSide
                    });
                }

                // MFD画面
                if (child.name === '左画面') {
                    左画面オブジェクト = child;
                    左画面オブジェクト.material = new THREE.MeshBasicMaterial({ map: leftTexture, side: THREE.FrontSide });
                }
                if (child.name === '右画面') {
                    右画面オブジェクト = child;
                    右画面オブジェクト.material = new THREE.MeshBasicMaterial({ map: rightTexture, side: THREE.FrontSide });
                }
            });

            updateScreens();

            if (読み込みデータ.cameras && 読み込みデータ.cameras.length > 0) {
                読み込みデータ.cameras.forEach((ファイル内カメラ) => {
                    if (ファイル内カメラ && ファイル内カメラ.isCamera) {
                        ファイル内カメラ.rotation.order = 'YXZ';
                        allParsedCameras.push(ファイル内カメラ);
                    }
                });
            }

            filterAndSetCameraList();

            const box = new THREE.Box3().setFromObject(現在のモデル);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            if (カメラリスト.length === 1 && カメラリスト[0] === デフォルトカメラ) {
                デフォルトカメラ.position.set(center.x, center.y - size.y * 0.2, center.z + size.z * 0.8);
                デフォルトカメラ.lookAt(center.x, center.y, center.z);
            }

            initWeaponObjects();
            applyWeaponVisibility();
        }

        function カメラを切り替える(番号) {
            if (!カメラリスト || カメラリスト.length === 0) return;
            現在のカメラ番号 = (番号 % カメラリスト.length + カメラリスト.length) % カメラリスト.length;
            const targetCam = カメラリスト[現在のカメラ番号];
            if (targetCam && targetCam.isCamera) {
                targetCam.rotation.order = 'YXZ';
                アクティブカメラ = targetCam;
                カメラの最適化(アクティブカメラ);
            }
        }

        function アニメーション開始(新状態) {
            アニメーション状態 = 新状態;
            アニメーション開始時間 = performance.now();
            アニメーション対象パーツ.forEach(p => {
                p.startQuat.copy(p.mesh.quaternion);
            });
        }

        function キャノピーアニメーション開始(新状態) {
            if (!キャノピーオブジェクト) return;
            キャノピーアニメーション状態 = 新状態;
            キャノピー開始時間 = performance.now();
            キャノピーStartQuat.copy(キャノピーオブジェクト.quaternion);
        }

        // キーイベント
        window.addEventListener('keydown', (イベント) => {
            initAudio();

            if (イベント.key === 'c' || イベント.key === 'C') {
                if (カメラリスト.length > 1) {
                    カメラを切り替える(現在のカメラ番号 + 1);
                }
                return;
            }

            if (イベント.key === 'g' || イベント.key === 'G') {
                if (アニメーション状態 === 'STOPPED') {
                    アニメーション開始('OPENING_HATCH');
                } else if (アニメーション状態 === 'OPEN') {
                    アニメーション開始('CLOSING_GEAR');
                }
                return;
            }

            if (イベント.key === 'v' || イベント.key === 'V') {
                if (キャノピーアニメーション状態 === 'STOPPED') {
                    キャノピーアニメーション開始('OPENING');
                } else if (キャノピーアニメーション状態 === 'OPEN') {
                    キャノピーアニメーション開始('CLOSING');
                }
                return;
            }

            if (イベント.key === '@' || イベント.code === 'KeyAt' || イベント.code === 'BracketLeft') {
                handleWeaponSelectionMenu();
                return;
            }

            if (武装選択モード有効) {
                if (イベント.key === '1' || イベント.code === 'Digit1') setWeaponForSelectedPylon('OFF');
                if (イベント.key === '2' || イベント.code === 'Digit2') setWeaponForSelectedPylon('Mk84_LD');
                if (イベント.key === '3' || イベント.code === 'Digit3') setWeaponForSelectedPylon('AIM-54');
                if (イベント.key === '4' || イベント.code === 'Digit4') setWeaponForSelectedPylon('AAM-3');
                return;
            }

            if (イベント.key === 'o' || イベント.key === 'O' || イベント.code === 'KeyO') {
                左画面モード = (左画面モード + 1) % 6;
                return;
            }

            if (イベント.key === 'p' || イベント.key === 'P' || イベント.code === 'KeyP') {
                右画面モード = (右画面モード + 1) % 6;
                return;
            }

            if (イベント.key === 'z' || イベント.key === 'Z' || イベント.code === 'KeyZ') {
                hmd有効 = !hmd有効;
                return;
            }

            if (イベント.key === 'x' || イベント.key === 'X' || イベント.code === 'KeyX') {
                hudRight有効 = !hudRight有効;
                if (HUD右オブジェクト) {
                    HUD右オブジェクト.visible = hudRight有効;
                }
                return;
            }

            if (イベント.code === 'ShiftLeft') { キー入力状態.ShiftLeft = true; playGunAudio(); }
            if (イベント.code === 'ShiftRight') { キー入力状態.ShiftRight = true; playGunAudio(); }

            if (イベント.code === 'KeyA') キー入力状態.KeyA = true;
            if (イベント.code === 'KeyD') キー入力状態.KeyD = true;
            if (イベント.code === 'KeyW') キー入力状態.KeyW = true;
            if (イベント.code === 'KeyS') キー入力状態.KeyS = true;

            if (イベント.code === 'KeyQ') キー入力状態.KeyQ = true;
            if (イベント.code === 'KeyE') キー入力状態.KeyE = true;

            if (イベント.key === '<' || イベント.key === ',' || イベント.code === 'Comma') キー入力状態.RudderLeft = true;
            if (イベント.key === '>' || イベント.key === '.' || イベント.code === 'Period') キー入力状態.RudderRight = true;

            if (イベント.key in キー入力状態) {
                キー入力状態[イベント.key] = true;
                if(イベント.key.startsWith('Arrow')) {
                    イベント.preventDefault(); 
                }
            }
        });

        window.addEventListener('keyup', (イベント) => {
            if (イベント.code === 'ShiftLeft') {
                キー入力状態.ShiftLeft = false;
                if (!キー入力状態.ShiftRight) stopGunAudio();
            }
            if (イベント.code === 'ShiftRight') {
                キー入力状態.ShiftRight = false;
                if (!キー入力状態.ShiftLeft) stopGunAudio();
            }

            if (イベント.code === 'KeyA') キー入力状態.KeyA = false;
            if (イベント.code === 'KeyD') キー入力状態.KeyD = false;
            if (イベント.code === 'KeyW') キー入力状態.KeyW = false;
            if (イベント.code === 'KeyS') キー入力状態.KeyS = false;

            if (イベント.code === 'KeyQ') キー入力状態.KeyQ = false;
            if (イベント.code === 'KeyE') キー入力状態.KeyE = false;

            if (イベント.key === '<' || イベント.key === ',' || イベント.code === 'Comma') キー入力状態.RudderLeft = false;
            if (イベント.key === '>' || イベント.key === '.' || イベント.code === 'Period') キー入力状態.RudderRight = false;

            if (イベント.key in キー入力状態) キー入力状態[イベント.key] = false;
        });

        const カメラ回転速度 = 0.03; 

        function アニメーション実行() {
            requestAnimationFrame(アニメーション実行);

            const 現在時刻 = performance.now();

            updateScreens();

            // オンラインテレメトリ同期パケット送信（ホスト側からゲスト側へ機体モデル各ノード情報を送信）
            if (currentRole === 'HOST' && activeConn && activeConn.open && アクティブカメラ) {
                const nodeTransforms = {};
                if (現在のモデル) {
                    現在のモデル.traverse((child) => {
                        if (child.name) {
                            nodeTransforms[child.name] = {
                                p: { x: child.position.x, y: child.position.y, z: child.position.z },
                                q: { x: child.quaternion.x, y: child.quaternion.y, z: child.quaternion.z, w: child.quaternion.w },
                                v: child.visible
                            };
                        }
                    });
                }

                activeConn.send({
                    type: 'telemetry',
                    camPos: { x: アクティブカメラ.position.x, y: アクティブカメラ.position.y, z: アクティブカメラ.position.z },
                    camRot: { x: アクティブカメラ.quaternion.x, y: アクティブカメラ.quaternion.y, z: アクティブカメラ.quaternion.z, w: アクティブカメラ.quaternion.w },
                    nodes: nodeTransforms,
                    throttle: スロットル量,
                    aileron: エルロン角度,
                    elevator: 昇降舵角度,
                    rudder: 方向舵角度,
                    leftMode: 左画面モード,
                    rightMode: 右画面モード,
                    hmd: hmd有効,
                    hudRight: hudRight有効
                });
            }

            // スロットル操作 (Qで推力上昇、Eで推力低下/初期位置復帰)
            if (キー入力状態.KeyQ) {
                スロットル量 = Math.min(1.0, スロットル量 + 0.015);
            }
            if (キー入力状態.KeyE) {
                スロットル量 = Math.max(0.0, スロットル量 - 0.015);
            }

            // スロットルの位置更新（+Z方向に最大1.465移動）
            if (スロットル右) {
                スロットル右.position.z = スロットル右_InitPos.z + (最大スロットル移動量 * スロットル量);
            }
            if (スロットル左) {
                スロットル左.position.z = スロットル左_InitPos.z + (最大スロットル移動量 * スロットル量);
            }

            // スロットル開度に連動したエンジンのZ軸回転速度制御
            const エンジン回転速度 = 0.05 + (スロットル量 * 0.45);
            if (エンジン右) エンジン右.rotation.z += エンジン回転速度;
            if (エンジン左) エンジン左.rotation.z += エンジン回転速度;

            // GAU-8 / 機体の前フレーム座標からの移動差分（慣性速度ベクトル）を計算
            const currGauPos = new THREE.Vector3();
            if (GAU8_Obj) {
                GAU8_Obj.getWorldPosition(currGauPos);
            } else if (現在のモデル) {
                現在のモデル.getWorldPosition(currGauPos);
            }

            if (isFirstFramePos) {
                prevGauPos.copy(currGauPos);
                gauVelocity.set(0, 0, 0);
                isFirstFramePos = false;
            } else {
                gauVelocity.subVectors(currGauPos, prevGauPos);
                prevGauPos.copy(currGauPos);
            }

            // GAU8 ガトリング砲回転 & 弾頭 (7種類) 連続発射（Shift押下時）
            const isFiring = キー入力状態.ShiftLeft || キー入力状態.ShiftRight;
            if (isFiring) {
                if (GAU8_Obj) {
                    GAU8_Obj.rotation.z += 0.8; // Z軸高回転
                }

                if (現在時刻 - lastFireTime > FIRE_INTERVAL) {
                    lastFireTime = 現在時刻;
                    
                    let baseObj = null;
                    for (let step = 0; step < 7; step++) {
                        let idx = (currentBulletIndex + step) % 7;
                        if (WinMag_BaseObjs[idx]) {
                            baseObj = WinMag_BaseObjs[idx];
                            currentBulletIndex = (idx + 1) % 7;
                            break;
                        }
                    }

                    const spawnPos = new THREE.Vector3();
                    if (baseObj) {
                        baseObj.updateMatrixWorld(true);
                        baseObj.getWorldPosition(spawnPos);
                    } else {
                        spawnPos.copy(currGauPos);
                    }

                    const bulletDir = new THREE.Vector3(0, 0, -1);
                    const modelQuat = new THREE.Quaternion();
                    if (現在のモデル) {
                        現在のモデル.getWorldQuaternion(modelQuat);
                        bulletDir.applyQuaternion(modelQuat).normalize();
                    }

                    const velocityVector = bulletDir.multiplyScalar(BULLET_SPEED).add(gauVelocity);

                    const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
                    bulletMesh.position.copy(spawnPos);
                    bulletMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), velocityVector.clone().normalize());

                    シーン.add(bulletMesh);
                    activeBullets.push({
                        mesh: bulletMesh,
                        velocity: velocityVector,
                        spawnTime: 現在時刻
                    });
                }
            }

            // 飛翔中弾丸の移動＆消去処理
            for (let i = activeBullets.length - 1; i >= 0; i--) {
                const b = activeBullets[i];
                b.mesh.position.add(b.velocity);

                if (現在時刻 - b.spawnTime > 2500) {
                    シーン.remove(b.mesh);
                    activeBullets.splice(i, 1);
                }
            }

            // 脚・ハッチアニメーション
            if (アニメーション状態 !== 'STOPPED' && アニメーション状態 !== 'OPEN') {
                let 経過時間 = (現在時刻 - アニメーション開始時間) / 1000;

                if (アニメーション状態 === 'OPENING_HATCH') {
                    let 進行度 = Math.min(経過時間 / 4.0, 1.0);
                    アニメーション対象パーツ.filter(p => p.type === 'HATCH').forEach(p => {
                        p.mesh.quaternion.slerpQuaternions(p.startQuat, ゼロ回転, 進行度);
                    });
                    if (進行度 >= 1.0) {
                        アニメーション開始('OPENING_GEAR');
                    }
                } else if (アニメーション状態 === 'OPENING_GEAR') {
                    let 進行度 = Math.min(経過時間 / 5.0, 1.0);
                    アニメーション対象パーツ.filter(p => p.type === 'GEAR').forEach(p => {
                        p.mesh.quaternion.slerpQuaternions(p.startQuat, ゼロ回転, 進行度);
                    });
                    if (進行度 >= 1.0) {
                        アニメーション状態 = 'OPEN';
                    }
                } else if (アニメーション状態 === 'CLOSING_GEAR') {
                    let 進行度 = Math.min(経過時間 / 5.0, 1.0);
                    アニメーション対象パーツ.filter(p => p.type === 'GEAR').forEach(p => {
                        p.mesh.quaternion.slerpQuaternions(p.startQuat, p.initQuat, 進行度);
                    });
                    if (進行度 >= 1.0) {
                        アニメーション開始('CLOSING_HATCH');
                    }
                } else if (アニメーション状態 === 'CLOSING_HATCH') {
                    let 進行度 = Math.min(経過時間 / 4.0, 1.0);
                    アニメーション対象パーツ.filter(p => p.type === 'HATCH').forEach(p => {
                        p.mesh.quaternion.slerpQuaternions(p.startQuat, p.initQuat, 進行度);
                    });
                    if (進行度 >= 1.0) {
                        アニメーション状態 = 'STOPPED';
                    }
                }
            }

            // キャノピーアニメーション
            if (キャノピーオブジェクト && キャノピーアニメーション状態 !== 'STOPPED' && キャノピーアニメーション状態 !== 'OPEN') {
                let 経過時間 = (現在時刻 - キャノピー開始時間) / 1000;

                if (キャノピーアニメーション状態 === 'OPENING') {
                    let 進行度 = Math.min(経過時間 / 4.0, 1.0);
                    キャノピーオブジェクト.quaternion.slerpQuaternions(キャノピーStartQuat, ゼロ回転, 進行度);
                    if (進行度 >= 1.0) {
                        キャノピーアニメーション状態 = 'OPEN';
                    }
                } else if (キャノピーアニメーション状態 === 'CLOSING') {
                    let 進行度 = Math.min(経過時間 / 4.0, 1.0);
                    キャノピーオブジェクト.quaternion.slerpQuaternions(キャノピーStartQuat, キャノピーInitQuat, 進行度);
                    if (進行度 >= 1.0) {
                        キャノピーアニメーション状態 = 'STOPPED';
                    }
                }
            }

            // エルロン操作
            if (キー入力状態.KeyA) {
                エルロン角度 = Math.min(エルロン角度 + 舵面移動速度, A10C_最大舵角);
            } else if (キー入力状態.KeyD) {
                エルロン角度 = Math.max(エルロン角度 - 舵面移動速度, -A10C_最大舵角);
            } else {
                if (エルロン角度 > 0) エルロン角度 = Math.max(0, エルロン角度 - 舵面移動速度);
                if (エルロン角度 < 0) エルロン角度 = Math.min(0, エルロン角度 + 舵面移動速度);
            }

            if (エルロン左) エルロン左.rotation.x = エルロン角度;
            if (エルロン右) エルロン右.rotation.x = -エルロン角度;

            // 昇降舵操作
            if (キー入力状態.KeyS) {
                昇降舵角度 = Math.min(昇降舵角度 + 舵面移動速度, A10C_最大舵角);
            } else if (キー入力状態.KeyW) {
                昇降舵角度 = Math.max(昇降舵角度 - 舵面移動速度, -A10C_最大舵角);
            } else {
                if (昇降舵角度 > 0) 昇降舵角度 = Math.max(0, 昇降舵角度 - 舵面移動速度);
                if (昇降舵角度 < 0) 昇降舵角度 = Math.min(0, 昇降舵角度 + 舵面移動速度);
            }

            if (昇降舵左) 昇降舵左.rotation.x = 昇降舵角度;
            if (昇降舵右) 昇降舵右.rotation.x = 昇降舵角度;

            // WASD連動による操縦桿の可動制御（最大±25°、符号反転）
            if (操縦桿) {
                操縦桿.rotation.x = -(昇降舵角度 / A10C_最大舵角) * 操縦桿_最大角度;
                操縦桿.rotation.z = (エルロン角度 / A10C_最大舵角) * 操縦桿_最大角度;
            }

            // 方向舵操作
            if (キー入力状態.RudderLeft) {
                方向舵角度 = Math.max(方向舵角度 - 舵面移動速度, -A10C_最大舵角);
            } else if (キー入力状態.RudderRight) {
                方向舵角度 = Math.min(方向舵角度 + 舵面移動速度, A10C_最大舵角);
            } else {
                if (方向舵角度 > 0) 方向舵角度 = Math.max(0, 方向舵角度 - 舵面移動速度);
                if (方向舵角度 < 0) 方向舵角度 = Math.min(0, 方向舵角度 + 舵面移動速度);
            }

            if (方向舵左) 方向舵左.rotation.y = 方向舵角度;
            if (方向舵右) 方向舵右.rotation.y = 方向舵角度;

            // カメラ操作
            if (アクティブカメラ && アクティブカメラ.isCamera) {
                _qCamDelta.identity();
                let camRotated = false;
                if (キー入力状態.ArrowUp || キー入力状態.ArrowDown) {
                    const 方向係数 = キー入力状態.ArrowUp ? 1 : -1;
                    _vCamRight.set(1, 0, 0).applyQuaternion(アクティブカメラ.quaternion);
                    if (_vCamRight.lengthSq() > 1e-6) _vCamRight.normalize();
                    if (isNumOk(_vCamRight.x) && isNumOk(_vCamRight.y) && isNumOk(_vCamRight.z)) {
                        _qCamDelta.multiply(_qRotDelta.setFromAxisAngle(_vCamRight, カメラ回転速度 * 方向係数));
                        camRotated = true;
                    }
                }
                if (キー入力状態.ArrowLeft || キー入力状態.ArrowRight) {
                    const 方向係数 = キー入力状態.ArrowLeft ? 1 : -1;
                    _qCamDelta.multiply(_qRotDelta.setFromAxisAngle(_vUp.set(0, 1, 0), カメラ回転速度 * 方向係数));
                    camRotated = true;
                }
                if (camRotated) {
                    アクティブカメラ.quaternion.premultiply(_qCamDelta);
                    safeQuat(アクティブカメラ.quaternion);
                }
            }

            if (アクティブカメラ && アクティブカメラ.isCamera) {
                レンダラー.render(シーン, アクティブカメラ);
            }
        }
        アニメーション実行();

        window.addEventListener('resize', () => {
            レンダラー.setSize(window.innerWidth, window.innerHeight);
            カメラリスト.forEach(カメラ => { if (カメラ && カメラ.isCamera) カメラの最適化(カメラ); });
        });

        // パイロン武装連動管理
        let 武装オブジェクトマップ = {};
        let パイロン武装状態 = {
            "パイロン01": "OFF", "パイロン02": "OFF", "パイロン03": "OFF", "パイロン04": "OFF", "パイロン05": "OFF",
            "パイロン06": "OFF", "パイロン07": "OFF", "パイロン08": "OFF", "パイロン09": "OFF", "パイロン10": "OFF", "パイロン11": "OFF",
            "AAM右側_右": "OFF", "AAM右側_左": "OFF"
        };

        let 武装選択モード有効 = false;
        let 選択中パイロンインデックス = -1;
        const パイロン名リスト = [
            "パイロン01", "パイロン02", "パイロン03", "パイロン04", "パイロン05",
            "パイロン06", "パイロン07", "パイロン08", "パイロン09", "パイロン10", "パイロン11",
            "AAM右側_右", "AAM右側_左"
        ];

        function getPylonWeaponIndex(pylonIndex) {
            return 10 - pylonIndex;
        }

        function initWeaponObjects() {
            武装オブジェクトマップ = {};
            if (!現在のモデル) return;

            現在のモデル.traverse((obj) => {
                const name = obj.name;
                const targetPatterns = [
                    /^Mk84_LD([1-9]|10)$/,
                    /^AIM-54([1-9]|10)$/,
                    /^AIM-541$/, /^AIM-542$/, /^AIM-543$/, /^AIM-544$/, /^AIM-545$/, /^AIM-546$/, /^AIM-547$/, /^AIM-548$/, /^AIM-549$/, /^AIM-5410$/,
                    /^AAM-3_PTM1$/, /^AAM-3_PTM2$/, /^AAM-3_PMT1$/, /^AAM-3_PMT2$/
                ];

                const isTarget = targetPatterns.some(pattern => pattern.test(name));
                if (isTarget) {
                    obj.visible = false;
                    武装オブジェクトマップ[name] = obj;
                }
            });
        }

        function applyWeaponVisibility() {
            if (!現在のモデル) return;

            Object.keys(武装オブジェクトマップ).forEach(name => {
                武装オブジェクトマップ[name].visible = false;
            });

            // パイロン01 〜 パイロン10 は AIM-54 と Mk84_LD のみ対応
            for (let idx = 0; idx < 10; idx++) {
                const pylonName = パイロン名リスト[idx];
                const num = getPylonWeaponIndex(idx);
                const selectedType = パイロン武装状態[pylonName];

                if (selectedType === "Mk84_LD") {
                    const targetName = `Mk84_LD${num}`;
                    if (武装オブジェクトマップ[targetName]) 武装オブジェクトマップ[targetName].visible = true;
                } else if (selectedType === "AIM-54") {
                    const targetName = `AIM-54${num}`;
                    if (武装オブジェクトマップ[targetName]) 武装オブジェクトマップ[targetName].visible = true;
                }
            }

            // AAM右側_右 と AAM右側_左 のみ AAM-3 を設置可能
            if (パイロン武装状態["AAM右側_右"] === "AAM-3") {
                if (武装オブジェクトマップ["AAM-3_PTM1"]) 武装オブジェクトマップ["AAM-3_PTM1"].visible = true;
                if (武装オブジェクトマップ["AAM-3_PMT1"]) 武装オブジェクトマップ["AAM-3_PMT1"].visible = true;
            }
            if (パイロン武装状態["AAM右側_左"] === "AAM-3") {
                if (武装オブジェクトマップ["AAM-3_PTM2"]) 武装オブジェクトマップ["AAM-3_PTM2"].visible = true;
                if (武装オブジェクトマップ["AAM-3_PMT2"]) 武装オブジェクトマップ["AAM-3_PMT2"].visible = true;
            }
        }

        function handleWeaponSelectionMenu() {
            if (!武装選択モード有効) {
                武装選択モード有効 = true;
                選択中パイロンインデックス = 0;
            } else {
                選択中パイロンインデックス++;
                if (選択中パイロンインデックス >= パイロン名リスト.length) {
                    武装選択モード有効 = false;
                    選択中パイロンインデックス = -1;
                }
            }
            updateStatusText();
            updateStoresUI();
        }

        function setWeaponForSelectedPylon(type) {
            if (選択中パイロンインデックス < 0 || 選択中パイロンインデックス >= パイロン名リスト.length) return;

            const pylonName = パイロン名リスト[選択中パイロンインデックス];
            setWeaponForPylonByName(pylonName, type);
        }

        function setWeaponForPylonByName(pylonName, type) {
            // パイロン01〜10、パイロン11には AAM-3 は設置不可（AAM右側_右、AAM右側_左 のみ設置可能）
            if ((pylonName !== "AAM右側_右" && pylonName !== "AAM右側_左") && type === "AAM-3") {
                type = "OFF";
            }
            // AAM右側_右、AAM右側_左 には Mk84_LD, AIM-54 は設置不可（AAM-3 のみ設置可能）
            if ((pylonName === "AAM右側_右" || pylonName === "AAM右側_左") && (type === "Mk84_LD" || type === "AIM-54")) {
                type = "OFF";
            }

            パイロン武装状態[pylonName] = type;

            applyWeaponVisibility();
            updateStatusText();
            updateStoresUI();
        }

        function updateStatusText() {
            const statusElem = document.getElementById('status');
            if (!statusElem) return;

            if (!武装選択モード有効) {
                statusElem.innerHTML = "【C】カメラ切替 / 【G】脚・ハッチ / 【V】キャノピー / 【Q/E】スロットル / 【W/S】操縦桿・昇降舵 / 【A/D】操縦桿・エルロン / 【< / >】方向舵 / 【@】武装選択 / 【O】左画面 / 【P】右画面 / 【Z】HMD切替 / 【X】HUD右切替 / 【Shift】GAU-8発射 / 【矢印キー】見回し";
            } else {
                const currentPylon = パイロン名リスト[選択中パイロンインデックス];
                const currentVal = パイロン武装状態[currentPylon];
                statusElem.innerHTML = `<span style="color:red;">【武装選択モード】</span> [1:OFF / 2:Mk84 / 3:AIM-54 / 4:AAM-3]<br>` +
                    `<b>選択中: ${currentPylon} (現在: ${currentVal})</b> | 次のパイロン選択・決定: 【@】`;
            }
        }

        const storesUI = document.getElementById('stores-monitor-ui');
        const pylonContainer = document.getElementById('pylon-list-container');
        const closeStoresBtn = document.getElementById('close-stores-btn');

        function createStoresUIElements() {
            pylonContainer.innerHTML = '';
            パイロン名リスト.forEach((pylonName) => {
                const row = document.createElement('div');
                row.className = 'pylon-row';

                const label = document.createElement('span');
                label.className = 'pylon-label';
                label.innerText = `${pylonName}:`;

                const select = document.createElement('select');
                select.className = 'pylon-select';
                select.id = `select-${pylonName}`;

                let options = [{ value: "OFF", label: "未搭載" }];
                
                if (pylonName === "AAM右側_右" || pylonName === "AAM右側_左") {
                    options.push({ value: "AAM-3", label: "AAM-3" });
                } else {
                    options.push({ value: "Mk84_LD", label: "Mk84_LD" });
                    options.push({ value: "AIM-54", label: "AIM-54" });
                }

                options.forEach(opt => {
                    const optElem = document.createElement('option');
                    optElem.value = opt.value;
                    optElem.innerText = opt.label;
                    select.appendChild(optElem);
                });

                select.addEventListener('change', (e) => {
                    setWeaponForPylonByName(pylonName, e.target.value);
                });

                row.appendChild(label);
                row.appendChild(select);
                pylonContainer.appendChild(row);
            });
        }

        createStoresUIElements();

        function updateStoresUI() {
            if (武装選択モード有効) {
                storesUI.style.display = 'block';
            } else {
                storesUI.style.display = 'none';
            }

            パイロン名リスト.forEach(pylonName => {
                const select = document.getElementById(`select-${pylonName}`);
                if (select) {
                    select.value = パイロン武装状態[pylonName];
                }
            });
        }

        closeStoresBtn.addEventListener('click', () => {
            武装選択モード有効 = false;
            選択中パイロンインデックス = -1;
            updateStatusText();
            updateStoresUI();
        });
    </script>
</body>
</html>
